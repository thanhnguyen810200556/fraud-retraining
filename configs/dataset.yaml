project:
  name: fraud-retraining
  random_seed: 42

paths:
  raw_dir: data/raw
  manifest: data/raw/dataset_manifest.csv
  profiling_dir: reports/data_profiling
  figures_dir: reports/figures

  processed_dir: data/processed
  preprocessing_report_dir: reports/preprocessing
  features_config: configs/features.yaml

  temporal_dir: data/temporal
  temporal_report_dir: reports/temporal

  label_schedule_dir: data/simulations/label_schedules
  label_delay_report_dir: reports/label_delay

datasets:
  ieee_cis:
    enabled: true
    role: primary

    transaction_path: data/raw/ieee_cis/train_transaction.csv
    identity_path: data/raw/ieee_cis/train_identity.csv

    id_column: TransactionID
    time_column: TransactionDT
    target_column: isFraud
    amount_column: TransactionAmt

    expected_transaction_rows: 590540
    expected_transaction_columns: 394

    expected_identity_rows: 144233
    expected_identity_columns: 41

    time_unit: seconds
    seconds_per_day: 86400

    use_identity: false

    excluded_features:
      - TransactionID
      - TransactionDT
      - isFraud

    no_card_id_columns:
      - card1
      - card2
      - card3
      - card4
      - card5
      - card6
      - addr1
      - addr2
      - P_emaildomain
      - R_emaildomain

    expected_full_features: 391
    expected_nocardid_features: 381

    processed_full_path: data/processed/ieee_full.parquet
    processed_nocardid_path: data/processed/ieee_nocardid.parquet

  baf:
    enabled: true
    role: secondary

    directory: data/raw/baf
    target_column: fraud_bool
    time_column: month
    time_unit: month

    variants:
      - Base.csv
      - Variant I.csv
      - Variant II.csv
      - Variant III.csv
      - Variant IV.csv
      - Variant V.csv

    expected_rows_per_variant: 1000000

    processed_directory: data/processed/baf

    expected_months:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7

temporal_split:
  version: "1.0.0"

  time_origin_strategy: first_transaction
  expected_time_origin: 86400

  warmup_start_day: 1
  warmup_end_day: 30

  validation_start_day: 31
  validation_end_day: 86

  test_start_day: 87
  test_end_day: 177

  block_size_days: 7

  expected_first_day: 1
  expected_last_day: 182

  expected_validation_blocks: 8
  expected_test_blocks: 13

  warmup_block_id: 0
  tail_block_id: -1

  include_tail_in_evaluation: false

baf_temporal_split:
  version: "1.0.0"

  warmup_start_month: 0
  warmup_end_month: 1

  validation_start_month: 2
  validation_end_month: 3

  test_start_month: 4
  test_end_month: 7

  block_size_months: 1

  expected_validation_blocks: 2
  expected_test_blocks: 4

  warmup_block_id: 0

simulation:
  version: "1.0.0"

  label_delay_strategy: fixed

  warmup_strategy: pre_labeled
  training_window_strategy: recent_event

  label_delay_days:
    - 0
    - 7
    - 14
    - 30

  training_window_days:
    - 30
    - 60
    - 90

  primary_label_delay_days: 7
  primary_training_window_days: 60

  label_availability_rule: strict_before
  decision_time: block_start

  allow_partial_history: true

  include_tail_in_schedule: true
  include_tail_in_training: false

  insufficient_training_data: skip_retrain

baf_simulation:
  version: "1.0.0"

  label_delay_strategy: fixed

  warmup_strategy: pre_labeled
  training_window_strategy: recent_event

  label_delay_months:
    - 0
    - 1
    - 2

  training_window_months:
    - 2
    - 3

  primary_label_delay_months: 1
  primary_training_window_months: 3

  label_availability_rule: at_or_before
  label_release_strategy: month_end_plus_delay

  decision_time: block_start

  allow_partial_history: true

  insufficient_training_data: skip_retrain

drift_eda:
  feature_set: NoCardID

  reference_phase: warmup

  psi_bins: 10
  psi_epsilon: 0.000001

  psi_moderate_threshold: 0.1
  psi_high_threshold: 0.25

  min_non_missing_samples: 100

  ks_max_samples: 10000

  top_k_features: 15

preprocessing:
  version: "1.0.0"

  missing_strategy: preserve
  outlier_strategy: preserve
  class_balance_strategy: preserve

  float_dtype: float64
  categorical_storage_dtype: string

  parquet_engine: pyarrow
  parquet_compression: snappy

  fail_on_duplicate_ids: true
  fail_on_invalid_labels: true
  fail_on_invalid_time: true
  fail_on_infinite_values: true
